name: Update Google Scholar publications

on:
  schedule:
    # Every Monday at 09:17 Korea Standard Time (00:17 UTC).
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar
  cancel-in-progress: false

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh publications and citation counts
        run: node scripts/update-scholar.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_AUTHOR_ID: AnztMl4AAAAJ

      - name: Publish changes
        run: |
          if git diff --quiet -- content.json; then
            echo "No publication changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json
          git commit -m "Update Google Scholar publications"
          git push
